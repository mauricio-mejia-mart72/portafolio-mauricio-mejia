<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ====== SEO / META (editable) ====== -->
  <title>Nombre Apellido — Fotografía</title>
  <meta name="description" content="Portafolio de fotografía de Nombre Apellido. Retrato, paisaje y fotografía urbana." />
  <meta name="author" content="Nombre Apellido" />

  <!-- Open Graph (para compartir en redes) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Nombre Apellido — Fotografía" />
  <meta property="og:description" content="Portafolio de fotografía. Retrato, paisaje y fotografía urbana." />
  <meta property="og:image" content="assets/og-image.jpg" />

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css?v=13" />
</head>
<body>

  <!-- ====== Preloader ====== -->
  <div class="preloader" id="preloader" aria-hidden="true">
    <span class="preloader__text">Cargando</span>
  </div>

  <!-- ====== Header / Nav ====== -->
  <header class="site-header" id="siteHeader">
    <a href="#hero" class="brand" data-scroll>Inicio</a>

    <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- ====== Menú overlay a pantalla completa (generado por js/main.js) ====== -->
  <div class="menu" id="menu" aria-hidden="true"></div>

  <!-- ====== Scroll nav editorial fija a la derecha (generada por js/main.js) ====== -->
  <nav class="scrollnav" id="scrollnav" aria-label="Progreso de secciones"></nav>

  <main>
    <!-- ====== Hero ====== -->
    <section class="hero" id="hero">
      <div class="hero__media" data-hero-bg>
        <img src="img/hero/hero.jpg" alt="" class="hero__img" id="heroImg" />
        <div class="hero__overlay"></div>
      </div>
      <div class="hero__content">
        <h1 class="hero__title">Nombre<br />Apellido</h1>
        <p class="hero__eyebrow" data-hero-el>Fotografía</p>
        <p class="hero__tagline" data-hero-el>Capturando luz, silencio e historias.</p>
      </div>
      <a href="#galerias" class="hero__scroll" data-scroll aria-label="Ir a las galerías">
        <span>Scroll</span>
        <span class="hero__scroll-line"></span>
      </a>
    </section>

    <!-- ====== Galerías por categoría (generadas por js/main.js) ====== -->
    <div id="galerias"></div>

    <!-- ====== Contacto (formulario estilo menú) ====== -->
    <section class="contacto" id="contacto">
      <div class="contacto__inner">
        <p class="contacto__eyebrow" data-reveal>¿Trabajamos juntos?</p>
        <h2 class="contacto__title" data-reveal>Hablemos.</h2>

        <form class="form" id="contactForm" data-reveal novalidate>
          <div class="form__field">
            <label class="form__label" for="f-nombre">01 — Nombre</label>
            <input class="form__input" id="f-nombre" name="nombre" type="text" required autocomplete="name" />
          </div>
          <div class="form__field">
            <label class="form__label" for="f-telefono">02 — Teléfono</label>
            <input class="form__input" id="f-telefono" name="telefono" type="tel" autocomplete="tel" />
          </div>
          <div class="form__field">
            <label class="form__label" for="f-correo">03 — Correo</label>
            <input class="form__input" id="f-correo" name="correo" type="email" required autocomplete="email" />
          </div>
          <div class="form__field">
            <label class="form__label" for="f-asunto">04 — Asunto</label>
            <input class="form__input" id="f-asunto" name="asunto" type="text" />
          </div>
          <button class="form__submit" type="submit">
            <span>Enviar</span><span class="form__submit-arrow" aria-hidden="true">→</span>
          </button>
          <p class="form__status" id="formStatus" role="status" aria-live="polite"></p>
        </form>

        <ul class="contacto__redes" id="contactoRedes" data-reveal>
          <!-- Las redes se generan desde js/main.js -->
        </ul>
      </div>
    </section>
  </main>

  <!-- ====== Footer ====== -->
  <footer class="site-footer">
    <span id="footerName">Nombre Apellido</span>
    <span>© <span id="year"></span></span>
  </footer>

  <!-- ====== Lightbox ====== -->
  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Vista ampliada">
    <button class="lightbox__close" id="lightboxClose" aria-label="Cerrar">&times;</button>
    <button class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" aria-label="Anterior">&#8249;</button>
    <img class="lightbox__img" id="lightboxImg" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" />
    <button class="lightbox__nav lightbox__nav--next" id="lightboxNext" aria-label="Siguiente">&#8250;</button>
    <p class="lightbox__caption" id="lightboxCaption"></p>
  </div>

  <!-- ====== Grano cinematográfico (textura sutil) ====== -->
  <div class="grain" aria-hidden="true"></div>

  <!-- ====== Librerías (CDN) ====== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <!-- Datos de la galería (generado por scripts/build-galeria.mjs) -->
  <script src="js/galeria.js?v=13"></script>
  <script src="js/main.js?v=13"></script>
</body>
</html>
